<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Inicio de sesion</h1>
    </header>

    <main>
       <!--arte de inicio de sesion-->
        <section class="inicio_sesion">
            <h2>Ingresa datos</h2>
            <form id="form_login">
                <label for="texto_usuario">Nombre de usuario</label>
                <input type="text" name="usuario" id="texto_usuario">
                <label for="texto_contrasena">Contraseña</label>
                <input type="password" name="contrasena" id="texto_contrasena">
                <button id="enviar_form">Enviar</button>
            </form>
            <p id="mensaje"></p>
        </section>

        <!--Parte de panel perfil.-->
        <section id="panel" class="oculto">
            <h2>Mi perfil</h2>
            <img id="fotoPerfil" src="" alt="Foto de perfil">
            <p id="nombre"></p>
            <p id="correo"></p>
            <p id="usuario_perfil"></p>
            <p id="telefono"></p>
            <p id="edad"></p>
            <button id="btn_salir">Cerrar sesion</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
